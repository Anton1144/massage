<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Для тебе ❤️</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: white;
      background: radial-gradient(circle at top, #54204f, #190d2b 60%, #090817);
    }
    .message {
      position: relative;
      z-index: 2;
      width: min(90vw, 700px);
      padding: 32px 22px;
      text-align: center;
      font-size: clamp(2rem, 8vw, 4.5rem);
      font-weight: 800;
      line-height: 1.2;
      text-shadow: 0 0 12px #ff72c6, 0 0 32px #ff2f9c;
      animation: appear 1.5s ease both, glow 2s ease-in-out infinite alternate;
      overflow-wrap: anywhere;
    }
    .subtitle {
      position: relative;
      z-index: 2;
      margin-top: -12px;
      color: #ffd8ef;
      font-size: clamp(.9rem, 3vw, 1.1rem);
      text-align: center;
      opacity: .9;
    }
    .heart {
      position: fixed;
      bottom: -50px;
      z-index: 1;
      pointer-events: none;
      animation: floatUp linear forwards;
      filter: drop-shadow(0 0 8px #ff5cb8);
    }
    @keyframes floatUp {
      to { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(24px) scale(.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px #ff72c6, 0 0 24px #ff2f9c; }
      to { text-shadow: 0 0 18px #ffc0e6, 0 0 44px #ff2f9c, 0 0 70px #ff2f9c; }
    }
  </style>
</head>
<body>
  <main>
    <div class="message" id="message"></div>
    <div class="subtitle">❤️</div>
  </main>

  <script>
    // ✏️ ЗМІНИ ТЕКСТ ОСЬ ТУТ:
    const message = "Я ЛЮБЛЮ ВІКУУУ ❤️";

    document.getElementById("message").textContent = message;

    // Анімовані сердечка на фоні
    const hearts = ["❤️", "💕", "💗", "💖", "💘"];
    function createHeart() {
      const heart = document.createElement("span");
      heart.className = "heart";
      heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (16 + Math.random() * 26) + "px";
      heart.style.animationDuration = (5 + Math.random() * 5) + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 10500);
    }
    setInterval(createHeart, 450);
    for (let i = 0; i < 10; i++) setTimeout(createHeart, i * 250);
  </script>
</body>
</html>
